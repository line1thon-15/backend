name: backend-ci

on:
  pull_request:
    branches: [dev, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      AI_CLIENT: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest (Fake AI, SQLite)
        run: python -m pytest
